<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08080a" />
  <title>ReplyMaven omnichannel flow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #08080a; }
    body { min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    main { width: min(100vw, 1600px); height: min(100svh, 632px); display: grid; place-items: center; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <main>
    <img src="/replymaven-omnichannel-flow-final.svg" alt="Website widget, Gmail, and webhooks flow into Maven in the ReplyMaven omni inbox. Maven routes escalations to Slack, Telegram, the ReplyMaven shared inbox, and Gmail." />
  </main>
</body>
</html>
